    .fade { animation: rise 1.4s cubic-bezier(.16,1,.3,1) both; }
    .fade2 { animation: rise 1.4s .25s cubic-bezier(.16,1,.3,1) both; }
    .fade3 { animation: rise 1.4s .5s cubic-bezier(.16,1,.3,1) both; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }
    .name { font: 300 64px 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -2px; fill: #F3F1FA; }
    .role { font: 400 22px 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; fill: url(#aurora); }
    .tag { font: 500 13px 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace; letter-spacing: 3.5px; fill: #9A93B5; }
    .ring { fill: none; stroke: url(#barfill); stroke-width: 1.2; opacity: .35; transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-out infinite; }
    @keyframes pulse { 0% { transform: scale(.6); opacity: .5 } 100% { transform: scale(1.5); opacity: 0 } }
    @media (prefers-reduced-motion: reduce) { .s, .b, .ring, .fade, .fade2, .fade3 { animation: none } }
